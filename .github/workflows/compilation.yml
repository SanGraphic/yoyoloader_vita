name: CI
on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    container: atamanenko/vitasdk-softfp:latest

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: '10'

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y zip
        cp stubs/libkubridge_stub.a /usr/local/vitasdk/arm-vita-eabi/lib
        cp stubs/libkubridge_stub_weak.a /usr/local/vitasdk/arm-vita-eabi/lib
        cp libs/libsndfile.a /usr/local/vitasdk/arm-vita-eabi/lib
        cp libs/libcurl.a /usr/local/vitasdk/arm-vita-eabi/lib
        cp libs/libssl.a /usr/local/vitasdk/arm-vita-eabi/lib
        cp libs/libcrypto.a /usr/local/vitasdk/arm-vita-eabi/lib
        git clone -b vgl --single-branch https://github.com/Rinnegatamante/openal-soft.git
        cd openal-soft/build
        cmake -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-mfloat-abi=softfp .. && make -j$(nproc) install
        cd ../..
        git clone https://github.com/bythos14/SceShaccCgExt.git
        cd SceShaccCgExt
        mkdir build && cd build
        cmake .. && make -j$(nproc) install
        cd ../..
        git clone https://github.com/Rinnegatamante/vitaShaRK.git
        make -C vitaShaRK -j$(nproc) install
        git clone https://github.com/Rinnegatamante/vitaGL.git
        make -C vitaGL DEPTH_STENCIL_HACK=1 SOFTFP_ABI=1 NO_DEBUG=1 SHARED_RENDERTARGETS=1 NO_SPLASHSCREEN=1 ENABLE_LEGACY_PIPELINE=1 -j$(nproc) install
        git clone https://github.com/frangarcj/opensles.git
        cd opensles/libopensles
        make -j$(nproc) install
        cd ../..

    - name: Compile project
      run: |
        git config --global --add safe.directory /__w/yoyoloader_vita/yoyoloader_vita
        git describe --abbrev=6 --dirty --always
        zip -9 -r banners.zip banners
        mkdir standalone
        mkdir standalone_video
        mkdir build
        cd build
        cmake -DLOADER=1 ..
        make -j$(nproc)
        mv loader2.bin loader.bin
        rm -f CMakeCache.txt
        cd ../standalone
        cmake -DLOADER=1 -DSTANDALONE=1 ..
        make -j$(nproc)
        cd ..
        make -C vitaGL DEPTH_STENCIL_HACK=1 SOFTFP_ABI=1 NO_DEBUG=1 PHYCONT_ON_DEMAND=1 SHARED_RENDERTARGETS=1 NO_SPLASHSCREEN=1 ENABLE_LEGACY_PIPELINE=1 -j$(nproc) clean
        make -C vitaGL DEPTH_STENCIL_HACK=1 SOFTFP_ABI=1 NO_DEBUG=1 PHYCONT_ON_DEMAND=1 SHARED_RENDERTARGETS=1 NO_SPLASHSCREEN=1 ENABLE_LEGACY_PIPELINE=1 -j$(nproc) install
        cd standalone_video
        cmake -DLOADER=1 -DVIDEO_SUPPORT=1 -DSTANDALONE=1 ..
        make -j$(nproc)
        cp loader2.bin ../launcher/builder/standalone_video.bin
        cd ../build
        cmake -DLOADER=1 -DVIDEO_SUPPORT=1 ..
        make clean
        make -j$(nproc)
        rm -f CMakeCache.txt
        cmake ..
        make -j$(nproc)
        cd ../launcher
        cp ../standalone/loader2.bin builder/standalone.bin
        cp ../livearea/bg0.png builder/assets/bg.png
        cp ../livearea/icon0.png builder/assets/icon0.png
        cp ../livearea/default_gate.png builder/assets/startup.png
        zip -9 -r builder.zip builder


    - name: Upload YoYoLoader.vpk artifact
      uses: actions/upload-artifact@v4
      with:
        name: YoYoLoader-patched
        path: build/YoYoLoader.vpk
        retention-days: 7

    - name: Upload loader2.bin artifact
      uses: actions/upload-artifact@v4
      with:
        name: loader2-patched
        path: build/loader2.bin
        retention-days: 7

    - name: Upload builder.zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: builder-patched
        path: launcher/builder.zip
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files

      - name: Release Latest Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Gamepad Hook Port Build"
          files: |
            release_files/YoYoLoader-patched/YoYoLoader.vpk
            release_files/loader2-patched/loader2.bin
            release_files/builder-patched/builder.zip
